# AgentTrading 설정 예시 — 복사해서 config/config.yaml 로 쓰고, 키는 .env 에 둔다.

ingest:
  # 확정: bitmex_public (시장 체결 테이프). 행동 표본은 합성 전략(Design Spec 6절) — aoa 원본은 진위 확인 후 조건부 추가.
  sources: [bitmex_public]
  out_dir: data/raw

backtest:
  initial_capital: 10000      # USDT
  taker_fee: 0.0004           # 0.04%
  maker_fee: 0.0002
  slippage_bps: 2             # 2bp
  # 백테스트 통과 기준 — 미달 전략은 에이전트로 보내지 않는다
  gate:
    min_trades: 100
    min_sharpe: 1.0
    max_drawdown: 0.30

agent:
  mode: paper                 # paper | live — live 전환은 수동 판단
  symbol: BTCUSDT
  max_leverage: 3
